{% extends "base.html" %}

{% block title %}Page Not Found - Campus Events Hub{% endblock %}

{% block content %}
<div class="error-container" style="text-align: center; padding: 100px 20px;">
    <h1 style="font-size: 48px; color: #ff7bd5; margin-bottom: 20px;">404</h1>
    <h2 style="color: #f5f9ff; margin-bottom: 20px;">Page Not Found</h2>
    <p style="color: #9aa9c2; margin-bottom: 30px;">
        Sorry, the page you're looking for doesn't exist or has been moved.
    </p>
    <a href="{{ url_for('home') }}" class="btn btn-primary" style="margin-top: 20px;">
        <i class="fas fa-home"></i> Back to Home
    </a>
</div>
{% endblock %}
